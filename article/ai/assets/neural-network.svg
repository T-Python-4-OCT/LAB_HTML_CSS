    .n3 { animation-delay: -1.8s; } .n4 { animation-delay: -2.4s; fill: #fbbf24; }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { .n { animation: none; opacity: .95; } }
  </style>
