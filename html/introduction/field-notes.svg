    <clipPath id="buraydah-globe"><circle cx="386" cy="245" r="48"/></clipPath>
    <pattern id="windows" width="18" height="24" patternUnits="userSpaceOnUse"><path d="M7 6h4v8H7z" fill="#dae0cc"/></pattern>
