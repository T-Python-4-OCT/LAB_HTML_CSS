<svg xmlns="http://www.w3.org/2000/svg" id="walking" width="960" height="640" viewBox="0 0 960 640" fill="none" role="img" aria-labelledby="title description">
  <title id="title">From Qassim to Riyadh</title>
  <desc id="description">Suliman, wearing glasses and a white Saudi thobe, is seen from behind and to the side, facing along the path toward Riyadh. The path links Buraydah Water Tower, a small house, fields and date palms in Qassim with Riyadh's skyline. In the CSS introduction his walk repeats with a gentle fade between journeys. Select the illustration to stop or restart it. The HTML introduction is still, and reduced motion disables autoplay.</desc>
  <style>
    .walker-route {
      transform: translate(550px, 461px) scale(.75);
      animation-name: var(--journey, none);
      animation-duration: 6.4s;
      animation-timing-function: linear;
      animation-fill-mode: both;
      animation-iteration-count: infinite;
    }
    .walker-body {
      animation-name: var(--bob, none);
      animation-duration: .4s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    .walker-limb {
      transform-box: view-box;
      transform-origin: 0 0;
      animation-duration: .8s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    .walker-leg-front, .walker-arm-back { animation-name: var(--stride, none); }
    .walker-leg-back, .walker-arm-front { animation-name: var(--counterstride, none); }
    .walker-thobe {
      transform-box: view-box;
      transform-origin: 0 -77px;
      animation-name: var(--drape, none);
      animation-duration: .8s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    @media (prefers-reduced-motion: no-preference) {

      svg:target {
        --journey: journey;
        --bob: walking-bob;
        --stride: walking-stride;
        --counterstride: walking-counterstride;
        --drape: walking-drape;
      }
    }

    #walking-request:target {
      --journey: journey;
      --bob: walking-bob;
      --stride: walking-stride;
      --counterstride: walking-counterstride;
      --drape: walking-drape;
    }
    @keyframes journey {
      0% { opacity: 0; transform: translate(372px, 606px) scale(.95); }
      6% { opacity: 1; }
      20% { transform: translate(383px, 551px) scale(.9); }
      40% { transform: translate(428px, 509px) scale(.85); }
      60% { transform: translate(476px, 489px) scale(.8); }
      80% { opacity: 1; transform: translate(550px, 461px) scale(.75); }
      90%, 100% { opacity: 0; transform: translate(550px, 461px) scale(.75); }
    }
    @keyframes walking-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    @keyframes walking-stride {
      0%, 50%, 100% { transform: rotate(0); }
      25% { transform: rotate(-15deg); }
      75% { transform: rotate(15deg); }
    }
    @keyframes walking-counterstride {
      0%, 50%, 100% { transform: rotate(0); }
      25% { transform: rotate(15deg); }
      75% { transform: rotate(-15deg); }
    }
    @keyframes walking-drape {
      0%, 50%, 100% { transform: rotate(0); }
      25% { transform: rotate(-1.5deg); }
      75% { transform: rotate(1.5deg); }
    }
  </style>
  <defs>
