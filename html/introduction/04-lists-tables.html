<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lists and Tables</title>
</head>
<body>
  <h1>Lists and Tables</h1>
  <h2>Unordered list</h2>
  <ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
  </ul>

  <h2>Ordered list</h2>
  <ol>
    <li>Learn HTML</li>
    <li>Learn CSS</li>
    <li>Build a project</li>
  </ol>

  <h2>Nested list</h2>
  <ul>
    <li>Fruits
      <ul>
        <li>Apple</li>
        <li>Banana</li>
      </ul>
    </li>
    <li>Vegetables</li>
  </ul>

  <h2>Table</h2>
  <!-- temporary -->
  <table border="1" cellpadding="6">
    <caption>Weekly Study Plan</caption>
    <thead>
      <tr>
        <th>Day</th>
        <th>Topic</th>
        <th>Hours</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Sunday</td>
        <td>HTML basics</td>
        <td>2</td>
      </tr>
      <tr>
        <td>Monday</td>
        <td>Links and images</td>
        <td>1</td>
      </tr>
      <tr>
        <td colspan="2">Total</td>
        <td>3</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
