<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Links and Images</title>
</head>
<body>
  <h1>Links and Images</h1>

  <h2>Links</h2>
  <!-- href = where the link goes -->
  <p><a href="https://developer.mozilla.org">External link: MDN Web Docs</a></p>
  <!-- target="_blank" opens in a new tab -->
  <p><a href="https://www.w3schools.com" target="_blank" rel="noopener">Open W3Schools in a new tab</a></p>
  <!-- Relative link to another page in this folder -->
  <p><a href="index.html">Back to the course index</a></p>

  <h2>Images</h2>
  <img src="images/sample.svg" alt="A blue mountain landscape" width="400">

  <h2>Image as a link</h2>
  <a href="01-basic-structure.html">
    <img src="images/sample.svg" alt="Go to the first lesson" width="200">
  </a>
</body>
</html>
