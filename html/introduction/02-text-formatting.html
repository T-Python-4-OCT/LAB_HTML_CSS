<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text and Formatting</title>
</head>
<body>
  <!-- Headings: h1 is the most important, h6 the least -->
  <h1>Heading 1</h1>
  <h2>Heading 2</h2>
  <h3>Heading 3</h3>
  <h4>Heading 4</h4>
  <h5>Heading 5</h5>
  <h6>Heading 6</h6>

  <!-- Paragraphs -->
  <p>This is a paragraph.</p>
  <p>This is another paragraph.</p>

  <!-- Bold and italic -->
  <p>This text is <b>bold</b>, this text is <i>italic</i>, and this is <b><i>both</i></b>.</p>

  <!-- Line break and horizontal line -->
  <p>First line<br>Second line</p>
  <hr>

  <!-- Practice: write a short paragraph about yourself below -->
  <h2>About Me</h2>
  <p>My name is <b>Abdulaziz Ayed</b>. I am learning <i>HTML</i>.</p>
</body>
</html>
