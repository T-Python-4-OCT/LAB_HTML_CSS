<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300">
  <rect width="500" height="300" fill="#ecfdf5"/>
  <!-- Water tank -->
  <rect x="20" y="110" width="60" height="80" fill="#2563eb"/>
  <text x="50" y="155" font-family="Arial" font-size="13" fill="#fff" text-anchor="middle">Tank</text>
  <!-- Main pipe -->
  <rect x="80" y="145" width="380" height="10" fill="#1e3a8a"/>
  <!-- Branch pipes -->
  <rect x="165" y="60" width="8" height="90" fill="#3b82f6"/>
  <rect x="285" y="150" width="8" height="90" fill="#3b82f6"/>
  <rect x="405" y="60" width="8" height="90" fill="#3b82f6"/>
  <!-- Zones -->
  <rect x="120" y="15" width="100" height="45" fill="#22c55e"/>
  <text x="170" y="43" font-family="Arial" font-size="13" fill="#fff" text-anchor="middle">Zone A</text>
  <rect x="240" y="240" width="100" height="45" fill="#16a34a"/>
  <text x="290" y="268" font-family="Arial" font-size="13" fill="#fff" text-anchor="middle">Zone B</text>
  <rect x="360" y="15" width="100" height="45" fill="#15803d"/>
  <text x="410" y="43" font-family="Arial" font-size="13" fill="#fff" text-anchor="middle">Zone C</text>
</svg>
