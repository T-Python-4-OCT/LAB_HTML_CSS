<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#1a1036"/>
      <stop offset="1" stop-color="#0d0d10"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#glow)"/>
  <!-- concentric rings -->
  <circle cx="200" cy="135" r="110" fill="none" stroke="#8b5cf6" stroke-opacity="0.15"/>
  <circle cx="200" cy="135" r="80" fill="none" stroke="#8b5cf6" stroke-opacity="0.25"/>
  <!-- laptop -->
  <rect x="120" y="80" width="160" height="100" rx="6" fill="#111114" stroke="url(#neon)" stroke-width="1.5"/>
  <text x="138" y="112" font-family="Consolas, monospace" font-size="13" fill="#8b5cf6">&lt;design&gt;</text>
  <text x="150" y="132" font-family="Consolas, monospace" font-size="13" fill="#f2efe9">&lt;code /&gt;</text>
  <text x="138" y="152" font-family="Consolas, monospace" font-size="13" fill="#8b5cf6">&lt;/design&gt;</text>
  <path d="M100 180 h200 l-14 16 h-172 z" fill="url(#neon)"/>
  <!-- play / motion -->
  <circle cx="318" cy="70" r="22" fill="none" stroke="url(#neon)" stroke-width="1.5"/>
  <path d="M312 60 L330 70 L312 80 z" fill="url(#neon)"/>
  <!-- pen / design -->
  <g transform="translate(70 70) rotate(-35)">
    <rect x="-4" y="-26" width="8" height="40" rx="2" fill="url(#neon)"/>
    <path d="M-4 14 L4 14 L0 26 z" fill="#22d3ee"/>
  </g>
  <!-- sparkles -->
  <path d="M330 200 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#8b5cf6"/>
  <path d="M72 205 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#22d3ee" opacity="0.7"/>
</svg>
